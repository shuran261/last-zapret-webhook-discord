name: Zapret Release Checker

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      send_test:
        description: "Отправить текущую версию в Discord"
        required: true
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest Zapret release
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_RUN: ${{ inputs.send_test }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from datetime import datetime

          API_URL = "https://api.github.com/repos/Flowseal/zapret-discord-youtube/releases/latest"
          STATE_FILE = Path("last_release.txt")

          # Получаем последний Release
          request = urllib.request.Request(
              API_URL,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "zapret-release-checker"
              }
          )

          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          tag = release["tag_name"]
          release_url = release["html_url"]
          body = release.get("body") or "Описание изменений отсутствует."
          author = release["author"]["login"]

          published_at = release.get("published_at", "")

          if published_at:
              try:
                  date = datetime.fromisoformat(
                      published_at.replace("Z", "+00:00")
                  ).strftime("%d.%m.%Y")
              except Exception:
                  date = "Неизвестно"
          else:
              date = "Неизвестно"

          # Ищем ZIP среди Assets
          assets = release.get("assets", [])

          zip_assets = [
              asset for asset in assets
              if asset.get("name", "").lower().endswith(".zip")
          ]

          # Если ZIP найден — берём первый
          if zip_assets:
              download_name = zip_assets[0]["name"]
              download_url = zip_assets[0]["browser_download_url"]
          else:
              download_name = "Открыть страницу релиза"
              download_url = release_url

          print(f"Версия: {tag}")
          print(f"Файл: {download_name}")
          print(f"Ссылка: {download_url}")

          test_run = os.environ.get("TEST_RUN", "false").lower() == "true"

          # Первый автоматический запуск только запоминает версию
          if not STATE_FILE.exists() and not test_run:
              STATE_FILE.write_text(tag)
              print(f"Запомнили текущую версию {tag}.")
              exit(0)

          old_tag = STATE_FILE.read_text().strip() if STATE_FILE.exists() else ""

          # Если новой версии нет
          if old_tag == tag and not test_run:
              print("Новой версии нет.")
              exit(0)

          if test_run:
              print("ТЕСТОВЫЙ ЗАПУСК")
          else:
              print(f"Найдена новая версия: {old_tag} -> {tag}")

          # Ограничиваем описание для Discord
          if len(body) > 3500:
              body = body[:3500] + "\n..."

          # Discord Embed
          payload = {
              "username": "Zapret Updates",
              "embeds": [
                  {
                      "title": f"🚀 Новая версия Zapret — {tag}",
                      "description": "Вышла новая версия **Zapret**!",
                      "url": release_url,
                      "color": 5793266,

                      "fields": [
                          {
                              "name": "📦 Версия",
                              "value": f"`{tag}`",
                              "inline": True
                          },
                          {
                              "name": "👤 Автор",
                              "value": f"`{author}`",
                              "inline": True
                          },
                          {
                              "name": "📅 Дата",
                              "value": f"`{date}`",
                              "inline": True
                          },
                          {
                              "name": "📝 Что изменилось",
                              "value": body,
                              "inline": False
                          },
                          {
                              "name": "⬇️ Скачать",
                              "value": f"[**Скачать {download_name}**]({download_url})",
                              "inline": False
                          }
                      ],

                      "footer": {
                          "text": "Flowseal • zapret-discord-youtube"
                      },

                      "timestamp": published_at if published_at else None
                  }
              ]
          }

          # Убираем timestamp, если его нет
          if not published_at:
              payload["embeds"][0].pop("timestamp", None)

          data = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          # Отправляем в Discord
          discord_request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Zapret Release Checker"
              },
              method="POST"
          )

          with urllib.request.urlopen(discord_request) as response:
              print("Discord response:", response.status)

          # Сохраняем версию
          STATE_FILE.write_text(tag)

          print("Сообщение успешно отправлено!")

          PY

      - name: Save release version
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_release.txt
          git commit -m "Update last Zapret release" || true
          git push
